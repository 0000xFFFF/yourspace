worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ───────────── rate limiting ─────────────
    # Pages: stricter. Media: very lenient (only extreme spam gets limited). Auth: strict.
    # NOTE: keyed by client IP. If you put Cloudflare/another proxy in front,
    # add set_real_ip_from + real_ip_header, or every user shares one IP.
    limit_req_zone $binary_remote_addr zone=pages:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=media:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m  rate=5r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:10m max_size=256m inactive=1h;

    # `app` resolves to every replica via Docker DNS (resolved at nginx start;
    # restart/reload nginx after scaling the app service).
    upstream app {
        least_conn;
        server app:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        client_max_body_size 100m;          # uploads
        limit_conn perip 50;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # Static assets (css/js/stickers): cached by nginx, no per-user logic
        location /static/ {
            proxy_pass http://app;
            proxy_cache static;
            proxy_cache_valid 200 1h;
            add_header X-Cache $upstream_cache_status;
            limit_req zone=media burst=300 nodelay;
        }

        # User media: the app authorizes the request (login, hide_sensitive setting, view-delete)
        # then answers with `X-Accel-Redirect: /_protected/<storage_key>`; nginx streams the file.
        location /media/ {
            limit_req zone=media burst=300 nodelay;
            proxy_pass http://app;
        }
        location /_protected/ {
            internal;
            alias /srv/media/;
            add_header Cache-Control "private, max-age=3600";
        }

        # WebSocket: realtime chat, typing indicators, read receipts
        location /ws {
            proxy_pass http://app;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Brute-force protection
        location ~ ^/(login|register|password-reset)$ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://app;
        }

        # Everything else = server-rendered pages
        location / {
            limit_req zone=pages burst=20 nodelay;
            proxy_pass http://app;
        }
    }
}
